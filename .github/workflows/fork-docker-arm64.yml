name: "Fork: Build and publish ARM64 slim image"

# Manually triggered build for this fork's OCI ARM64 (Ampere A1) deployment.
# Uses GitHub's hosted ubuntu-24.04-arm runner (free on public repositories)
# for native linux/arm64 builds without QEMU emulation, and leaves upstream
# release-publish.yml untouched so future rebases stay conflict-free.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Your Docker Hub username
#   DOCKERHUB_TOKEN     Docker Hub Personal Access Token (Read & Write)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker Hub image tag to publish (keep "slim" to match upstream sandbox tag)'
        required: false
        default: 'slim'
        type: string
      push_sha_tag:
        description: 'Also publish an immutable <tag>-<short-sha> tag for rollback pinning'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-docker-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64-slim:
    name: Build and push linux/arm64 slim
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs and secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_SHA_TAG: ${{ inputs.push_sha_tag }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN repository secret."
            exit 1
          fi
          if ! printf '%s' "${INPUT_TAG}" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'; then
            echo "::error::Invalid Docker tag '${INPUT_TAG}'."
            exit 1
          fi
          actual="$(dpkg --print-architecture)"
          echo "Runner architecture: ${actual}"
          if [ "${actual}" != "arm64" ]; then
            echo "::error::Expected arm64 runner, got ${actual}."
            exit 1
          fi
          short_sha="${GITHUB_SHA::7}"
          repo="${DOCKERHUB_USERNAME}/pipeshub-ai"
          tags="${repo}:${INPUT_TAG}"
          if [ "${PUSH_SHA_TAG}" = "true" ]; then
            tags="${tags}
          ${repo}:${INPUT_TAG}-${short_sha}"
          fi
          {
            echo "short_sha=${short_sha}"
            echo "repo=${repo}"
            echo "tags<<EOF"
            printf '%s\n' "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        id: meta

      - name: Reclaim runner disk space
        run: |
          set -uo pipefail
          before=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          after=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "Free disk space: ${before}G -> ${after}G"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve prebuilt upstream base images
        run: |
          set -euo pipefail
          for pair in PYTHON_DEPS_IMAGE=python-deps-slim RUNTIME_BASE_IMAGE=runtime; do
            var="${pair%%=*}"
            tag="${pair#*=}"
            image="pipeshubai/pipeshub-ai-base:${tag}"
            if ! docker pull --platform linux/arm64 "${image}"; then
              echo "::warning::Could not pull ${image} from Docker Hub; falling back to GHCR mirror."
              image="ghcr.io/pipeshub-ai/pipeshub-ai-base:${tag}"
              docker pull --platform linux/arm64 "${image}"
            fi
            echo "${var}=${image}" >> "$GITHUB_ENV"
          done

      - name: Build and push linux/arm64 slim image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            PYTHON_DEPS_IMAGE=${{ env.PYTHON_DEPS_IMAGE }}
            RUNTIME_BASE_IMAGE=${{ env.RUNTIME_BASE_IMAGE }}
            APP_VERSION=fork-${{ steps.meta.outputs.short_sha }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=fork-arm64-slim
          cache-to: type=gha,scope=fork-arm64-slim,mode=max

      - name: Publish summary
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISHED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published ARM64 slim image"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Digest: \`${BUILD_DIGEST}\`"
            echo "- Tags:"
            while IFS= read -r t; do
              [ -n "$t" ] && echo "  - \`${t}\`"
            done <<< "${PUBLISHED_TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"
